<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Rates Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Currency Rates</h1>
        <div class="controls">
            <input type="text" id="base-currency" value="USD">
            <button id="fetch-btn">Get Rates</button>
        </div>
        <div id="status-message"></div>
        <ul id="rates-list"></ul>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
