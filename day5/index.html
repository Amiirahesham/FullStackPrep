<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechStore E-commerce</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <h1>TechStore</h1>
    </div>
  </header>

  <main class="dashboard">
    <section class="store-section">
      <header class="section-header">
        <h2>Products</h2>
        <div class="filters">
          <button id="filter-all">All</button>
          <button id="filter-electronics">Electronics</button>
          <button id="filter-kitchen">Kitchen</button>
        </div>
      </header>
      <div id="product-grid" class="product-grid">
        <div class="product-card">
          <span class="product-category">Electronics</span>
          <h3 class="product-title">Laptop</h3>
          <p class="product-price">$1200.00</p>
          <button class="add-to-cart-btn" onclick="addToCart(1)">Add to Cart</button>
        </div>
        <div class="product-card">
          <span class="product-category">Electronics</span>
          <h3 class="product-title">Wireless Mouse</h3>
          <p class="product-price">$40.00</p>
          <button class="add-to-cart-btn" onclick="addToCart(2)">Add to Cart</button>
        </div>
        <div class="product-card">
          <span class="product-category">Electronics</span>
          <h3 class="product-title">Mechanical Keyboard</h3>
          <p class="product-price">$120.00</p>
          <button class="add-to-cart-btn" onclick="addToCart(3)">Add to Cart</button>
        </div>
        <div class="product-card">
          <span class="product-category">Kitchen</span>
          <h3 class="product-title">Ceramic Mug</h3>
          <p class="product-price">$15.00</p>
          <button class="add-to-cart-btn" onclick="addToCart(4)">Add to Cart</button>
        </div>
      </div>
    </section>

    <aside class="cart-section">
      <header class="section-header">
        <h2>Your Cart</h2>
      </header>
      <div class="cart-actions">
        <button id="sort-asc">Sort Low to High</button>
        <button id="sort-desc">Sort High to Low</button>
      </div>
      <div class="cart-container">
        <ul id="cart-list" class="cart-list">
        </ul>
      </div>
      <div class="cart-footer">
        <div class="total-row">
          <span>Total</span>
          <span id="cart-total">$0.00</span>
        </div>
        <button id="checkout-btn" class="checkout-btn" disabled>Proceed to Checkout</button>
      </div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
